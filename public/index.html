<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=localStorage.getItem("unisteel_theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
<title>UNI STEEL — Commercial Kitchen Solutions</title>
<meta name="description" content="UNI STEEL — مصنع مصري لتصنيع وتجهيز المطابخ التجارية بالمقاس. Commercial kitchen manufacturer in Egypt.">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home" data-title="nav.home">
<div id="site-header"></div>
<main>
<section class="hero">
  <div class="hero-frame">
    <div class="container">
      <span class="eyebrow ltr" data-i18n="hero.eyebrow"></span>
      <h1><span data-i18n="hero.t1"></span> <em data-i18n="hero.t2"></em></h1>
      <p class="lead" data-i18n="hero.lead"></p>
      <div class="hero-cta">
        <a class="btn btn-dark" href="contact.html"><span data-i18n="hero.cta1"></span><span class="btn-ico"></span></a>
        <a class="btn btn-primary" href="products.html" data-i18n="hero.cta2"></a>
      </div>
    </div>
  </div>
  <div class="container hero-media-wrap">
    <div class="hero-stage">
      <div class="hero-media ph" id="hero-media"></div>
      <div class="hero-floats" id="hero-floats"></div>
    </div>
    <div class="chips">
      <span class="chip" data-i18n="chip.warranty"></span>
      <span class="chip" data-i18n="chip.custom"></span>
      <span class="chip" data-i18n="chip.install"></span>
      <span class="chip" data-i18n="chip.export"></span>
    </div>
  </div>
</section>

<section class="section">
  <div class="container"><div class="row-head">
    <h2 data-i18n-html="home.prod.title"></h2>
    <a class="btn btn-primary" href="products.html" data-i18n="common.all"></a>
  </div></div>
  <div class="rail" id="home-rail"></div>
</section>

<section class="section"><div class="container"><div class="dark-block">
  <h2 data-i18n-html="svc.title"></h2>
  <p data-i18n="svc.sub"></p>
  <div class="svc-grid" id="home-svc"></div>
</div></div></section>

<section class="section"><div class="container">
  <div class="section-head center"><h2 data-i18n-html="home.cats.title"></h2><p data-i18n="home.cats.sub"></p></div>
  <div class="menu-grid">
    <div class="menu-col" id="menu-left"></div>
    <div class="menu-center" id="menu-center"></div>
    <div class="menu-col" id="menu-right"></div>
  </div>
  <p class="center" style="margin-top:32px"><a class="btn btn-primary" href="products.html" data-i18n="hero.cta2"></a></p>
</div></section>

<section class="section alt"><div class="container">
  <div class="section-head"><h2 data-i18n="home.process.title"></h2><p data-i18n="home.process.sub"></p></div>
  <div class="steps" id="home-steps"></div>
</div></section>

<div id="home-trust"></div>

<section class="section"><div class="container">
  <div class="section-head center"><h2 data-i18n-html="home.venues.title"></h2><p data-i18n="home.venues.sub"></p></div>
  <div class="circles" id="home-venues"></div>
</div></section>

<section class="section alt"><div class="container">
  <div class="row-head"><div><h2 data-i18n="home.projects.title"></h2><p style="color:var(--steel)" data-i18n="home.projects.sub"></p></div>
  <a class="btn btn-ghost" href="projects.html" data-i18n="common.all"></a></div>
  <div class="grid grid-3" id="home-projects"></div>
</div></section>

<section class="section"><div class="container split">
  <div id="home-factory-img"></div>
  <div>
    <h2 data-i18n="home.factory.title"></h2>
    <p data-i18n="home.factory.text"></p>
    <ul class="ticks"><li data-i18n="factory.1"></li><li data-i18n="factory.2"></li><li data-i18n="factory.3"></li></ul>
    <div class="hero-cta">
      <a class="btn btn-dark" href="contact.html"><span data-i18n="cta.quote"></span><span class="btn-ico"></span></a>
      <a class="btn btn-ghost" href="about.html" data-i18n="nav.about"></a>
    </div>
  </div>
</div></section>

<section class="section"><div class="container">
  <div class="section-head center"><h2 data-i18n-html="home.contacts.title"></h2><p data-i18n="home.contacts.sub"></p></div>
  <div class="people people-center" id="home-contacts"></div>
</div></section>

<section class="section"><div class="container faq faq-wrap">
  <div><h2 data-i18n="faq.title"></h2><p class="lead-sm" data-i18n="home.faq.sub"></p>
  <p style="margin-top:18px"><a class="btn btn-ghost" href="contact.html" data-i18n="nav.contact"></a></p></div>
  <div id="faq-list"></div>
</div></section>
</main>
<div id="site-footer"></div>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
