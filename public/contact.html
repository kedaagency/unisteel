<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=localStorage.getItem("unisteel_theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
<title>UNI STEEL — Commercial Kitchen Solutions</title>
<meta name="description" content="UNI STEEL — مصنع مصري لتصنيع وتجهيز المطابخ التجارية بالمقاس. Commercial kitchen manufacturer in Egypt.">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact" data-title="nav.contact">
<div id="site-header"></div>
<main>
<section class="page-head"><div class="container">
<h1 data-i18n="contact.title"></h1><p data-i18n="contact.sub"></p></div></section>
<section class="section"><div class="container contact-grid">
  <form class="form" id="quote-form" novalidate>
    <div class="form-row two">
      <div class="field"><label for="f-name" data-i18n="f.name"></label><input id="f-name" name="name" autocomplete="name" required></div>
      <div class="field"><label for="f-phone" data-i18n="f.phone"></label><input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required></div>
    </div>
    <div class="form-row two">
      <div class="field"><label for="f-type" data-i18n="f.type"></label><select id="f-type" name="type"></select></div>
      <div class="field"><label for="f-area" data-i18n="f.area"></label><input id="f-area" name="area" type="number" inputmode="numeric" min="0"><div class="hint" data-i18n="f.area.hint"></div></div>
    </div>
    <div class="field"><label for="f-products" data-i18n="f.products"></label><select id="f-products" name="products"></select></div>
    <div class="field"><label for="f-msg" data-i18n="f.msg"></label><textarea id="f-msg" name="message" data-i18n-ph="f.msg.ph"></textarea></div>
    <div class="form-status" id="form-status" role="status"></div>
    <button class="btn btn-primary btn-block" type="submit" data-i18n="f.submit"></button>
    <p class="form-note" data-i18n="f.note"></p>
  </form>
  <aside class="info-card" id="contact-info"></aside>
</div></section>
<section class="section alt"><div class="container faq">
  <div class="section-head"><h2 data-i18n="faq.title"></h2></div>
  <div id="faq-list"></div>
</div></section>
</main>
<div id="site-footer"></div>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
