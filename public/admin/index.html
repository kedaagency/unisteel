<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة تحكم UNI STEEL</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<section id="login" class="login" hidden>
  <form class="login-card" id="login-form">
    <img src="/img/logo-black.png" alt="UNI STEEL" class="login-logo">
    <h1>لوحة التحكم</h1>
    <p class="muted">ادخل باسم المستخدم وكلمة السر عشان تعدّل في الموقع.</p>
    <label class="f"><span>اسم المستخدم</span><input type="text" id="login-user" autocomplete="username" dir="ltr" autocapitalize="none" spellcheck="false" required></label>
    <label class="f"><span>كلمة السر</span><input type="password" id="login-pw" autocomplete="current-password" required></label>
    <div class="err" id="login-err" hidden></div>
    <button class="btn primary block" type="submit">دخول</button>
    <p class="muted small">نسيت كلمة السر؟ اطلب من مدير الموقع يغيّرها لك.</p>
  </form>
</section>

<div id="app" hidden>
  <header class="topbar">
    <a class="brand" href="/admin/" aria-label="UNI STEEL"><img src="/img/logo-white.png" alt="UNI STEEL" class="brand-logo"></a>
    <span class="brand-title">لوحة التحكم</span>
    <span class="spacer"></span>
    <a class="top-btn" href="/" target="_blank" rel="noopener" title="عرض الموقع">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span>عرض الموقع</span>
    </a>
    <button class="top-btn" id="logout" type="button" title="خروج">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg><span>خروج</span>
    </button>
    <button class="burger" id="burger" type="button" aria-label="القائمة" aria-expanded="false" aria-controls="side"><span></span></button>
  </header>

  <div class="shell">
    <aside class="side" id="side">
      <nav id="tabs" aria-label="أقسام لوحة التحكم"></nav>
      <div class="side-user">
        <div class="avatar" id="avatar" aria-hidden="true"></div>
        <div class="who-text"><b id="who-name"></b><small id="who-role"></small></div>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <main class="main">
      <div class="banner" id="banner-wrap" hidden><div class="hint-box bad" id="banner"></div></div>
      <div class="panel-head">
        <div class="panel-titles"><h1 id="panel-title"></h1><p id="panel-desc"></p></div>
        <div class="head-actions" id="head-actions"></div>
      </div>
      <div id="panel"></div>
    </main>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<script src="/js/config.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
